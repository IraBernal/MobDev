<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website - Learning Task 2.3</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>My Website</h1>
    <p>Pure CSS Logo Showcase</p>
  </header>

  <main>
    <!-- Logo 1 -->
    <section class="logo-section">
      <h2>Logo 1 — Git Style</h2>
      <div class="git-logo">
        <div class="git-box">
          <div class="git-line git-line--long"></div>
          <div class="git-line git-line--short"></div>
          <div class="git-circle"></div>
          <div class="git-circle"></div>
          <div class="git-circle"></div>
        </div>
      </div>
    </section>

    <!-- Logo 2 -->
    <section class="logo-section">
      <h2>Logo 2 — Custom "M" Style</h2>
      <div class="m-logo">
        <div class="m-arch m-arch--left"></div>
        <div class="m-arch m-arch--right"></div>
      </div>
    </section>
  </main>

</body>
</html>
